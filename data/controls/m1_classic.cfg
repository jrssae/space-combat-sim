; Built-in control profile, read-only. Select it with `controls use m1_classic` (console), `save` to keep it.
;
; The original M1 pad layout, before the play-test swap: the right stick X yaws and the D-pad Left/Right rolls.
; Everything else is the default layout (architecture 6.1), the keyboard and the mouse included (layout B: every flight
; key under the left hand, the mouse flies pitch and yaw, Caps Lock and G roll).
;
; The input layer treats a yaw action as a ramped button (0 to full in settings.yaw_ramp_s) and the roll actions as
; part of the stick vector, so here the stick yaws through the ramp rather than proportionally, and the D-pad rolls at
; full rate. The bindings are what moved; the shaping is the current input layer's.

[profile]

format=1
description="Original M1 layout: right stick X yaws, D-pad Left/Right rolls"

[bindings]

main_right=["pad:axis:5+", "key:E", "key:W"]
main_left=["pad:axis:4+", "key:Q", "key:W"]
retro_right=["pad:button:10", "key:D", "key:S"]
retro_left=["pad:button:9", "key:A", "key:S"]
pitch_down=["pad:axis:3-"]
pitch_up=["pad:axis:3+"]
yaw_left=["pad:axis:2-"]
yaw_right=["pad:axis:2+"]
strafe_left=["pad:axis:0-", "key:Z"]
strafe_right=["pad:axis:0+", "key:C"]
strafe_down=["pad:axis:1+", "key:F"]
strafe_up=["pad:axis:1-", "key:R"]
roll_left=["pad:button:13", "key:CapsLock"]
roll_right=["pad:button:14", "key:G"]
target_next=["pad:button:11", "key:B", "mouse:2"]
weapon_next=["pad:button:12", "key:V", "mouse:9"]
target_ahead=[]
target_prev=[]
fire=["pad:button:0", "key:Space", "mouse:1"]
toggle_flight_assist=["pad:button:1", "key:T"]
brake=["pad:button:8", "key:X"]
autotrack=["pad:button:2", "key:Shift", "mouse:8"]
camera_look=["pad:button:7", "mouse:3"]
toggle_camera=["pad:button:3", "key:Tab"]
reset_ship=["pad:button:4", "key:Backspace"]
pause=["pad:button:6", "key:Escape"]
debug_toggle_overlay=["key:F3"]
debug_toggle_fallback_mesh=["key:F4"]
screenshot=["key:N", "key:Print"]
wing_attack=["key:1"]
wing_form=["key:2"]
wing_engage=["key:3"]
wing_cover=["key:4"]

[deadzones]

main_right=0.05
main_left=0.05
retro_right=0.5
retro_left=0.5
pitch_down=0.15
pitch_up=0.15
yaw_left=0.15
yaw_right=0.15
strafe_left=0.15
strafe_right=0.15
strafe_down=0.15
strafe_up=0.15
roll_left=0.5
roll_right=0.5
target_next=0.5
weapon_next=0.5
target_ahead=0.5
target_prev=0.5
fire=0.5
toggle_flight_assist=0.5
brake=0.5
autotrack=0.5
camera_look=0.5
toggle_camera=0.5
reset_ship=0.5
pause=0.5
debug_toggle_overlay=0.5
debug_toggle_fallback_mesh=0.5
screenshot=0.5
wing_attack=0.5
wing_form=0.5
wing_engage=0.5
wing_cover=0.5
