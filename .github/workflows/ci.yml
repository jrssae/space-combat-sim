name: CI

# Python generator tests, asset generation, the native library (required), headless Godot import, compile check and GUT,
# all without a GPU.
# Anything that needs a GPU is verified by a human, never here (docs/architecture.md, section 12).

on:
  # Doc-only commits (plans, milestones, research notes) change no code or test, so they skip the 40-minute run; info.md stays
  # in, because a test checks the console command list against it.
  push:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "info.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "info.md"

permissions:
  contents: read

jobs:
  test:
    # GUT takes about 40 minutes on the maintainer's machine, more than one runner job should hold, so three jobs share it
    # (scripts/run_tests.sh, GUT_SHARD); shard 1 also runs the Python tests and the console smoke runs. Two shards came
    # within seconds of the job limit after M4-T22 (shard 1: 44:57 of 45 minutes).
    name: test (GUT shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install numpy

      # The pinned version lives in scripts/setup_godot.sh only; the cache key follows it.
      - name: Read pinned Godot version
        id: godot
        run: |
          version="$(sed -n 's/^GODOT_VERSION="\(.*\)"$/\1/p' scripts/setup_godot.sh)"
          if [[ -z "${version}" ]]; then
            echo "Could not read GODOT_VERSION from scripts/setup_godot.sh" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ steps.godot.outputs.version }}

      - name: Install Godot
        run: scripts/setup_godot.sh

      # The native library (native/, Rust with gdext; architecture section 17.5). Cargo's downloads and build files are
      # cached on Cargo.lock and the pinned Rust version, so only a change to either rebuilds gdext from scratch.
      # rustup on the runner installs the version native/rust-toolchain.toml pins. run_tests.sh finds it up to date.
      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools/native-target
          key: native-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}

      - name: Build native library
        run: time scripts/build_native.sh

      - name: Generate assets
        run: scripts/gen_assets.sh

      - name: Run tests
        run: scripts/run_tests.sh
        env:
          GUT_SHARD: ${{ matrix.shard }}/3
          # The slow files (the long seeded parity fights, the pending balance runs) run here (M4-T36, Q58).
          GUT_SLOW: "1"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore
