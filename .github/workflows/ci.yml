name: CI

# Python generator tests, asset generation, headless Godot import, compile check and GUT, all without a GPU.
# Anything that needs a GPU is verified by a human, never here (docs/architecture.md, section 12).

on:
  # Doc-only commits (plans, milestones, research notes) change no code or test, so they skip the 40-minute run; info.md stays
  # in, because a test checks the console command list against it.
  push:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "info.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "info.md"

permissions:
  contents: read

jobs:
  test:
    # GUT takes about 25 minutes on the maintainer's machine, more than one runner job should hold, so two jobs share it
    # (scripts/run_tests.sh, GUT_SHARD); shard 1 also runs the Python tests and the console smoke runs.
    name: test (GUT shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install numpy pillow

      # The pinned version lives in scripts/setup_godot.sh only; the cache key follows it.
      - name: Read pinned Godot version
        id: godot
        run: |
          version="$(sed -n 's/^GODOT_VERSION="\(.*\)"$/\1/p' scripts/setup_godot.sh)"
          if [[ -z "${version}" ]]; then
            echo "Could not read GODOT_VERSION from scripts/setup_godot.sh" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .tools
          key: godot-${{ runner.os }}-${{ steps.godot.outputs.version }}

      - name: Install Godot
        run: scripts/setup_godot.sh

      - name: Generate assets
        run: scripts/gen_assets.sh

      - name: Run tests
        run: scripts/run_tests.sh
        env:
          GUT_SHARD: ${{ matrix.shard }}/2

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore
