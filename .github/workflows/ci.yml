name: CI

# Python generator tests, asset generation, the native library (required), headless Godot import, compile check and GUT,
# all without a GPU.
# Anything that needs a GPU is verified by a human, never here (docs/architecture.md, section 12).

on:
  # Doc-only commits (plans, milestones, research notes) change no code or test, so they skip the run; info.md stays in,
  # because a test checks the console command list against it (test_info_md).
  push:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "info.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "info.md"

permissions:
  contents: read

jobs:
  # Builds the generated assets once and fills the cache that every other job restores, so a cache miss costs one
  # generation (about 6 minutes) instead of one per job. On a hit this job only looks the key up and downloads nothing.
  assets:
    name: generated assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install numpy

      # The shard list and count live in scripts/python_shards.py only; the check fails the run if any test module would
      # run in no shard, so a new test file is never skipped.
      - name: Plan the Python test shards
        id: shards
        run: |
          python scripts/python_shards.py check
          echo "shards=$(python scripts/python_shards.py matrix)" >> "${GITHUB_OUTPUT}"

      - name: Restore generated assets
        id: assets
        uses: actions/cache@v4
        with:
          path: assets/generated
          lookup-only: true
          key: assets-${{ runner.os }}-py3.12-${{ hashFiles('tools/procgen/**') }}

      - name: Generate assets
        if: steps.assets.outputs.cache-hit != 'true'
        run: scripts/gen_assets.sh

  # The generator's own tests, split over runners (scripts/python_shards.py): one runner needed 24 minutes and hit the
  # 30-minute limit. One Python test reads the built raider, so each shard restores the assets from the job above.
  python:
    name: python tests (shard ${{ matrix.shard }})
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.assets.outputs.shards) }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install numpy

      - name: Restore generated assets
        id: assets
        uses: actions/cache/restore@v4
        with:
          path: assets/generated
          key: assets-${{ runner.os }}-py3.12-${{ hashFiles('tools/procgen/**') }}

      # Only if the entry was evicted between the jobs.
      - name: Generate assets
        if: steps.assets.outputs.cache-hit != 'true'
        run: scripts/gen_assets.sh

      - name: Python tests
        run: |
          mapfile -t modules < <(python scripts/python_shards.py modules "${{ matrix.shard }}")
          printf 'shard ${{ matrix.shard }}: %s\n' "${modules[@]}"
          python -m unittest -v "${modules[@]}"

  test:
    # GUT takes about 40 minutes on the maintainer's machine, more than one runner job should hold, so three jobs share it
    # (scripts/run_tests.sh, GUT_SHARD); shard 1 also runs the Rust tests and the console smoke runs, the Python tests have the
    # sharded job above (M5-T38). A shard's GUT timeout (40 minutes, run_tests.sh) fires before this job limit.
    name: test (GUT shard ${{ matrix.shard }} of 3)
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install numpy

      # The pinned version lives in scripts/setup_godot.sh only; the cache key follows it.
      - name: Read pinned Godot version
        id: godot
        run: |
          version="$(sed -n 's/^GODOT_VERSION="\(.*\)"$/\1/p' scripts/setup_godot.sh)"
          if [[ -z "${version}" ]]; then
            echo "Could not read GODOT_VERSION from scripts/setup_godot.sh" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ steps.godot.outputs.version }}

      - name: Install Godot
        run: scripts/setup_godot.sh

      # The native library (native/, Rust with gdext; architecture section 17.5). Cargo's downloads and build files are
      # cached on Cargo.lock and the pinned Rust version, so only a change to either rebuilds gdext from scratch.
      # rustup on the runner installs the version native/rust-toolchain.toml pins. run_tests.sh finds it up to date.
      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools/native-target
          key: native-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}

      - name: Build native library
        run: time scripts/build_native.sh

      - name: Restore generated assets
        id: assets
        uses: actions/cache@v4
        with:
          path: assets/generated
          key: assets-${{ runner.os }}-py3.12-${{ hashFiles('tools/procgen/**') }}

      # The assets job has filled the cache; this only runs if the entry was evicted since.
      - name: Generate assets
        if: steps.assets.outputs.cache-hit != 'true'
        run: scripts/gen_assets.sh

      - name: Run tests
        run: scripts/run_tests.sh
        env:
          PYTHON_TESTS: "0"
          GUT_SHARD: ${{ matrix.shard }}/3
          # The slow files (the long seeded parity fights, the pending balance runs) run here (M4-T36, Q58).
          GUT_SLOW: "1"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore
